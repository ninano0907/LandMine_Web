<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#334e46">
  <meta name="description" content="거대 채굴 로봇을 지키며 금광을 개척하는 서부 스팀펑크 디펜스">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="황금의 철마">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>황금의 철마 · 서부 채굴 디펜스</title>
  <style>
    html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#f3e2be;overscroll-behavior:none;}
    #loading {position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:16px system-ui;color:#334e46;}
    #loading h1{font-size:40px;margin:0 0 12px} #loading p{line-height:1.8}
    #install{position:fixed;right:12px;bottom:12px;z-index:10;border:1px solid #b59b64;border-radius:8px;padding:10px 16px;background:#334e46;color:#fff;font:14px system-ui;cursor:pointer}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="loading" role="status"><h1>황금의 철마</h1><p>서부 채굴 디펜스<br>증기기관을 예열하고 있습니다…</p></div>
  <button id="install" hidden>앱 설치</button>
  <script src="pwa.js?v=2"></script>
</body>
</html>
