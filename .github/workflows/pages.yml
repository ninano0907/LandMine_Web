name: Validate web game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check_pwa.cjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: dart analyze lib test tool
        working-directory: app
      - run: bash scripts/build.sh
      - run: cp sw.js app/build/web/sw.js && touch app/build/web/.nojekyll
      - name: Publish built PWA to Pages branch root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish rebuilt PWA [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-game
          path: app/build/web
