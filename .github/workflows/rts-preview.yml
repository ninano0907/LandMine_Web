name: Deploy RTS preview
on:
  push:
    branches:
      - feature/rts-starcraft-style
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rts-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos lib/rts lib/frontier lib/main.dart
        working-directory: app
      - run: flutter test test/rts_map_test.dart test/frontier_test.dart
        working-directory: app
      - name: Build RTS web preview
        working-directory: app
        run: |
          BUILD_NUMBER="$(git rev-list --count abeceed8ced20fe8f48bf0caed1a0622e818c76c..HEAD)"
          flutter build web --release --dart-define=BUILD_NUMBER="$BUILD_NUMBER" --base-href /LandMine_Web/rts/ --pwa-strategy=none --no-web-resources-cdn
      - name: Generate isolated RTS offline cache
        run: python3 scripts/service_worker.py --namespace rts-preview --output app/build/web/sw.js
      - name: Publish preview to main Pages subdirectory
        run: |
          set -euo pipefail
          mkdir -p /tmp/rts-preview
          cp -a app/build/web/. /tmp/rts-preview/
          git fetch origin main
          git checkout main
          mkdir -p rts
          find rts -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a /tmp/rts-preview/. rts/
          touch rts/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rts
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish RTS preview [skip ci]"
            git push origin main
          fi
