<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="랜드마인 웹앱">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>랜드마인 웹앱</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0f172a; color: white; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); text-align: center; line-height: 1.4; }
  </style>
</head>
<body>
  <main><h1>랜드마인 웹앱 테스트 성공! 🎉</h1></main>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
    }
  </script>
</body>
</html>
