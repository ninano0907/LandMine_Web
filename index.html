<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/LandMine_Web/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#473b2b">
  <meta name="description" content="광맥을 찾아 광부를 배치하고, 레일과 수레로 금을 생산하는 광산 경영 게임">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="광맥">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <title>광맥 · 사람과 수레의 시대</title>
  <style>
    html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#ede5d2;overscroll-behavior:none;}
    #loading {position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:16px system-ui;color:#473b2b;}
    #loading h1{font-size:40px;margin:0 0 12px} #loading p{line-height:1.8}
    #install{position:fixed;right:12px;bottom:12px;z-index:10;border:1px solid #b59b64;border-radius:8px;padding:10px 16px;background:#473b2b;color:#fff;font:14px system-ui;cursor:pointer}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="loading" role="status"><h1>광맥</h1><p>사람과 수레의 시대<br>광산을 준비하고 있습니다…</p></div>
  <button id="install" hidden>앱 설치</button>
  <script src="pwa.js?v=2"></script>
</body>
</html>
